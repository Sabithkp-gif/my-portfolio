<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <linearGradient id="comp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1D1B"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>
    <linearGradient id="terracotta-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C85A32"/>
      <stop offset="100%" stop-color="#A2421E"/>
    </linearGradient>
    <filter id="soft-depth" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="30" stdDeviation="35" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Gradient Halo -->
  <circle cx="450" cy="320" r="300" fill="#C85A32" opacity="0.08" filter="blur(60px)"/>

  <!-- Main Central Architecture Canvas Board (Layer 1) -->
  <g transform="translate(150, 60)" filter="url(#soft-depth)">
    <rect x="0" y="0" width="600" height="480" rx="24" fill="#181716" stroke="#2C2A27" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect x="0" y="0" width="600" height="42" rx="24" fill="#201E1C"/>
    <circle cx="24" cy="21" r="5" fill="#C85A32"/>
    <circle cx="40" cy="21" r="5" fill="#77736D"/>
    <circle cx="56" cy="21" r="5" fill="#3D3A35"/>
    <text x="300" y="26" fill="#8C887E" font-family="monospace" font-size="11" text-anchor="middle">sabith.workspace // creative-core.dart</text>

    <!-- Canvas Inner Grid -->
    <g transform="translate(30, 65)">
      <!-- Left side: Code & Logic Flow -->
      <g font-family="monospace" font-size="11">
        <text x="0" y="15" fill="#8C887E">// Sabith — Creative Technologist</text>
        <text x="0" y="40" fill="#C85A32">class <tspan fill="#F5F3EE">DigitalProduct</tspan> extends <tspan fill="#DAD6CE">Ecosystem</tspan> {</text>
        <text x="20" y="65" fill="#77736D">final MobileEngine mobile = Flutter.native();</text>
        <text x="20" y="90" fill="#77736D">final BackendService api = FastAPI.async();</text>
        <text x="20" y="115" fill="#77736D">final EdgeTelemetry hardware = ESP8266.link();</text>
        <text x="20" y="145" fill="#C85A32">Future&lt;Experience&gt; <tspan fill="#F5F3EE">craft</tspan>() async {</text>
        <text x="40" y="170" fill="#E8E5DD">await sync(speed: 120.fps, feel: "sensory");</text>
        <text x="40" y="195" fill="#22C55E">return Experience.deliver();</text>
        <text x="20" y="220" fill="#C85A32">}</text>
        <text x="0" y="245" fill="#C85A32">}</text>
      </g>

      <!-- Right side: Mini Live Graph -->
      <g transform="translate(330, 20)">
        <rect x="0" y="0" width="210" height="150" rx="12" fill="#211F1D" stroke="#33302B" stroke-width="1"/>
        <text x="16" y="28" fill="#8C887E" font-family="sans-serif" font-size="10" letter-spacing="1">LATENCY &amp; FPS</text>
        <text x="16" y="62" fill="#F5F3EE" font-family="sans-serif" font-size="24" font-weight="700">0.02s</text>
        <!-- Sparkline -->
        <path d="M 16 115 L 45 100 L 80 120 L 115 90 L 150 105 L 190 75" fill="none" stroke="#C85A32" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="190" cy="75" r="4" fill="#C85A32"/>
      </g>
    </g>
  </g>

  <!-- Floating UI Layer 1 (Left Forefront Card) -->
  <g transform="translate(40, 310)" filter="url(#soft-depth)">
    <rect x="0" y="0" width="240" height="170" rx="18" fill="#F5F3EE" stroke="#DAD6CE" stroke-width="1.5"/>
    <text x="20" y="36" fill="#77736D" font-family="sans-serif" font-size="10" letter-spacing="1" font-weight="600">SYSTEM ARCHITECTURE</text>
    <text x="20" y="70" fill="#111111" font-family="sans-serif" font-size="20" font-weight="700">Full-Stack Craft</text>
    <text x="20" y="92" fill="#55524D" font-family="sans-serif" font-size="12">Mobile • Web • IoT • AI</text>
    <line x1="20" y1="110" x2="220" y2="110" stroke="#E2DED5" stroke-width="1"/>
    <circle cx="28" cy="136" r="4" fill="#22C55E"/>
    <text x="40" y="140" fill="#22C55E" font-family="sans-serif" font-size="11" font-weight="600">Production Ready</text>
  </g>

  <!-- Floating UI Layer 2 (Right Forefront Card) -->
  <g transform="translate(640, 200)" filter="url(#soft-depth)">
    <rect x="0" y="0" width="230" height="200" rx="18" fill="#181716" stroke="#383530" stroke-width="1.5"/>
    <text x="20" y="36" fill="#8C887E" font-family="sans-serif" font-size="10" letter-spacing="1">CURRENT STATUS</text>
    <text x="20" y="72" fill="#F5F3EE" font-family="sans-serif" font-size="18" font-weight="600">Building Digital Experiences</text>
    
    <g transform="translate(20, 95)">
      <rect x="0" y="0" width="190" height="34" rx="8" fill="#242220"/>
      <text x="14" y="21" fill="#DAD6CE" font-family="monospace" font-size="11">⚡ 120Hz Flutter Engine</text>
    </g>
    <g transform="translate(20, 138)">
      <rect x="0" y="0" width="190" height="34" rx="8" fill="#242220"/>
      <text x="14" y="21" fill="#DAD6CE" font-family="monospace" font-size="11">🤖 Local LLM RAG Active</text>
    </g>
  </g>
</svg>
