<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="lumina-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1918"/>
      <stop offset="100%" stop-color="#0F0E0D"/>
    </linearGradient>
    <filter id="lumina-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#lumina-bg)"/>

  <!-- Editorial Grid Background -->
  <g stroke="#E8E5DD" stroke-opacity="0.04" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="800"/>
    <line x1="360" y1="0" x2="360" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="840" y1="0" x2="840" y2="800"/>
    <line x1="1080" y1="0" x2="1080" y2="800"/>
  </g>

  <!-- Browser Window Mockup -->
  <g transform="translate(180, 100)" filter="url(#lumina-shadow)">
    <!-- Window Body -->
    <rect x="0" y="0" width="840" height="600" rx="16" fill="#F6F5F2" stroke="#DAD6CE" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect x="0" y="0" width="840" height="44" rx="16" fill="#EAE7DF"/>
    <!-- Controls -->
    <circle cx="24" cy="22" r="6" fill="#E17055"/>
    <circle cx="44" cy="22" r="6" fill="#FDCB6E"/>
    <circle cx="64" cy="22" r="6" fill="#00B894"/>
    <!-- Address Bar -->
    <rect x="220" y="8" width="400" height="28" rx="14" fill="#F6F5F2" stroke="#D8D4CA" stroke-width="1"/>
    <text x="420" y="26" fill="#77736D" font-family="sans-serif" font-size="11" text-anchor="middle">lumina.editorial.studio/canvas</text>

    <!-- Inside Web Content -->
    <!-- Nav -->
    <text x="40" y="80" fill="#111111" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2">LUMINA</text>
    <text x="740" y="80" fill="#77736D" font-family="sans-serif" font-size="12" text-anchor="end">INDEX / WORKS / ARCHIVE</text>
    
    <!-- Hero Headline inside canvas -->
    <text x="40" y="160" fill="#111111" font-family="'Times New Roman', serif" font-style="italic" font-size="44">Sensory</text>
    <text x="210" y="160" fill="#111111" font-family="sans-serif" font-size="42" font-weight="800" letter-spacing="-1">KINETIC ENGINE</text>
    
    <text x="40" y="200" fill="#77736D" font-family="sans-serif" font-size="14">A zero-dependency momentum scroll &amp; spatial layout framework.</text>

    <!-- Interactive Card Grid Inside -->
    <g transform="translate(40, 240)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="240" height="300" rx="12" fill="#111111"/>
      <circle cx="120" cy="120" r="50" fill="#C85A32" opacity="0.8"/>
      <text x="24" y="240" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600">Spatial Flow</text>
      <text x="24" y="265" fill="#AAAAAA" font-family="sans-serif" font-size="11">GSAP Timeline Sync</text>

      <!-- Card 2 -->
      <rect x="260" y="0" width="240" height="300" rx="12" fill="#EAE7DF" stroke="#D8D4CA" stroke-width="1"/>
      <rect x="285" y="40" width="190" height="150" rx="8" fill="#FFFFFF"/>
      <text x="284" y="240" fill="#111111" font-family="sans-serif" font-size="16" font-weight="600">Lenis Smooth</text>
      <text x="284" y="265" fill="#77736D" font-family="sans-serif" font-size="11">60fps Virtual Physics</text>

      <!-- Card 3 -->
      <rect x="520" y="0" width="240" height="300" rx="12" fill="#1A1918"/>
      <path d="M 550 120 Q 640 40, 730 120 T 750 180" stroke="#E8E5DD" stroke-width="2" fill="none"/>
      <text x="544" y="240" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600">Clamp Grid</text>
      <text x="544" y="265" fill="#888888" font-family="sans-serif" font-size="11">Fluid Typography</text>
    </g>
  </g>

  <!-- Floating Performance Tag -->
  <g transform="translate(940, 480)" filter="url(#lumina-shadow)">
    <rect x="0" y="0" width="180" height="90" rx="14" fill="#111111" stroke="#333333" stroke-width="1"/>
    <text x="20" y="32" fill="#888888" font-family="sans-serif" font-size="10" letter-spacing="1">LIGHTHOUSE</text>
    <text x="20" y="65" fill="#22C55E" font-family="sans-serif" font-size="26" font-weight="700">99 / 100</text>
  </g>
</svg>
