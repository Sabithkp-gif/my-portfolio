<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="sec-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>
    <filter id="sec-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sec-bg)"/>

  <!-- Radar / Circular concentric sonar rings in background -->
  <g stroke="#10B981" stroke-opacity="0.08" stroke-width="1.5">
    <circle cx="600" cy="400" r="150" fill="none"/>
    <circle cx="600" cy="400" r="280" fill="none"/>
    <circle cx="600" cy="400" r="420" fill="none"/>
    <line x1="600" y1="50" x2="600" y2="750"/>
    <line x1="150" y1="400" x2="1050" y2="400"/>
  </g>

  <!-- Terminal Window Mockup -->
  <g transform="translate(180, 110)" filter="url(#sec-shadow)">
    <!-- Terminal Outer Frame -->
    <rect x="0" y="0" width="840" height="580" rx="16" fill="#121316" stroke="#2D3039" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect x="0" y="0" width="840" height="44" rx="16" fill="#1A1C23"/>
    <circle cx="24" cy="22" r="6" fill="#EF4444"/>
    <circle cx="44" cy="22" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="22" r="6" fill="#10B981"/>
    <text x="420" y="27" fill="#9CA3AF" font-family="monospace" font-size="12" text-anchor="middle">sabith@sentinel:~/security/recon (python3 -m sentinel --audit)</text>

    <!-- Terminal Content Area -->
    <g transform="translate(30, 75)" font-family="monospace" font-size="12">
      <!-- Banner -->
      <text x="0" y="0" fill="#10B981">[+] SENTINEL GUARD v1.8 - NETWORK RECONNAISSANCE ENGINE</text>
      <text x="0" y="22" fill="#6B7280">Target Subnet: 192.168.1.0/24 | Mode: Non-Intrusive Asynchronous Probe</text>
      <line x1="0" y1="35" x2="780" y2="35" stroke="#2D3039" stroke-width="1"/>

      <text x="0" y="65" fill="#38BDF8">[*] Probing socket endpoints across 1,024 standard ports...</text>
      <text x="0" y="90" fill="#E5E7EB">[192.168.1.1]   Port 53  (DNS)   ── STATUS: OPEN [BIND 9.18] - Secure</text>
      <text x="0" y="115" fill="#E5E7EB">[192.168.1.1]   Port 443 (HTTPS) ── STATUS: OPEN [TLS 1.3 / ChaCha20] - Pass</text>
      <text x="0" y="140" fill="#E5E7EB">[192.168.1.42]  Port 22  (SSH)   ── STATUS: OPEN [OpenSSH 9.6p1] - Pubkey Only</text>
      <text x="0" y="165" fill="#F59E0B">[192.168.1.88]  Port 1883 (MQTT) ── STATUS: OPEN [Mosquitto IoT Broker] - Token Auth</text>
      
      <!-- Box summary -->
      <rect x="0" y="195" width="780" height="150" rx="8" fill="#181A20" stroke="#2D3039" stroke-width="1"/>
      <g transform="translate(20, 25)">
        <text x="0" y="0" fill="#10B981" font-weight="700">AUDIT COMPLETED IN 0.84 SECONDS</text>
        <text x="0" y="26" fill="#D1D5DB">Hosts Alive: 4 | Scanned Ports: 4,096 | Anomalies: 0</text>
        <text x="0" y="52" fill="#D1D5DB">Cipher Suite Compliance: NIST 800-52r2 Validated ✓</text>
        <text x="0" y="78" fill="#6B7280">Report generated: /var/log/sentinel/audit_2026_09.json</text>
      </g>

      <!-- Command Line Prompt -->
      <text x="0" y="380" fill="#10B981">sabith@sentinel:~$</text>
      <text x="160" y="380" fill="#E5E7EB">cat /var/log/sentinel/summary.txt</text>
      <rect x="425" y="367" width="8" height="15" fill="#10B981"/>
    </g>
  </g>
</svg>
