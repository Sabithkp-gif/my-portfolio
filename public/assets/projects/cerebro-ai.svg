<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151B"/>
      <stop offset="100%" stop-color="#0B0C10"/>
    </linearGradient>
    <filter id="ai-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#ai-bg)"/>

  <!-- Neural Connection Nodes Diagram in Background -->
  <g stroke="#6366F1" stroke-opacity="0.12" stroke-width="1.5">
    <line x1="200" y1="200" x2="350" y2="400"/>
    <line x1="350" y1="400" x2="550" y2="250"/>
    <line x1="550" y1="250" x2="800" y2="450"/>
    <line x1="800" y1="450" x2="1000" y2="300"/>
    <circle cx="200" cy="200" r="6" fill="#6366F1" opacity="0.4"/>
    <circle cx="350" cy="400" r="6" fill="#6366F1" opacity="0.4"/>
    <circle cx="550" cy="250" r="6" fill="#6366F1" opacity="0.4"/>
    <circle cx="800" cy="450" r="6" fill="#6366F1" opacity="0.4"/>
    <circle cx="1000" cy="300" r="6" fill="#6366F1" opacity="0.4"/>
  </g>

  <!-- AI Workspace Desktop App Mockup -->
  <g transform="translate(180, 110)" filter="url(#ai-shadow)">
    <!-- App Frame -->
    <rect x="0" y="0" width="840" height="580" rx="16" fill="#1E1F29" stroke="#313449" stroke-width="1.5"/>
    
    <!-- App Header Bar -->
    <rect x="0" y="0" width="840" height="46" rx="16" fill="#171821"/>
    <circle cx="24" cy="23" r="6" fill="#EF4444"/>
    <circle cx="44" cy="23" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="23" r="6" fill="#10B981"/>
    <text x="420" y="28" fill="#9CA3AF" font-family="monospace" font-size="12" text-anchor="middle">CEREBRO AI // LOCAL ENGINE [OLLAMA ACTIVE: LLAMA-3.2 3B]</text>

    <!-- Sidebar -->
    <rect x="0" y="46" width="220" height="534" fill="#15161E"/>
    <g transform="translate(20, 75)">
      <text x="0" y="0" fill="#6B7280" font-family="sans-serif" font-size="11" letter-spacing="1">SEMANTIC WORKSPACES</text>
      
      <rect x="-5" y="15" width="190" height="32" rx="6" fill="#252736"/>
      <text x="10" y="36" fill="#E5E7EB" font-family="sans-serif" font-size="12">📁 repo/michat-core</text>

      <text x="10" y="75" fill="#9CA3AF" font-family="sans-serif" font-size="12">📁 repo/pulse-firmware</text>
      <text x="10" y="110" fill="#9CA3AF" font-family="sans-serif" font-size="12">📁 docs/architecture</text>

      <text x="0" y="170" fill="#6B7280" font-family="sans-serif" font-size="11" letter-spacing="1">LOCAL VECTOR STORE</text>
      <text x="10" y="200" fill="#10B981" font-family="monospace" font-size="11">ChromaDB: 1,480 docs</text>
      <text x="10" y="225" fill="#6B7280" font-family="monospace" font-size="10">Embedding: bge-m3 (384d)</text>
    </g>

    <!-- Main Chat & RAG Stream Area -->
    <g transform="translate(240, 65)">
      <!-- Query Card -->
      <rect x="0" y="10" width="570" height="50" rx="10" fill="#252736"/>
      <text x="20" y="40" fill="#E5E7EB" font-family="sans-serif" font-size="13">Explain how SQLite connection pools are synchronized with Riverpod.</text>

      <!-- AI Streaming Response Box -->
      <rect x="0" y="75" width="570" height="350" rx="10" fill="#181922" stroke="#2D2F40" stroke-width="1"/>
      <g transform="translate(20, 25)">
        <text x="0" y="0" fill="#818CF8" font-family="sans-serif" font-size="12" font-weight="600">Cerebro Local Agent · 42ms retrieval</text>
        <text x="0" y="30" fill="#D1D5DB" font-family="sans-serif" font-size="13">Retrieved 3 contextual chunks from <tspan fill="#38BDF8">lib/core/database_bus.dart</tspan>:</text>

        <!-- Code Chunk Box -->
        <rect x="0" y="45" width="530" height="150" rx="8" fill="#101117"/>
        <g transform="translate(15, 25)" font-family="monospace" font-size="11">
          <text x="0" y="0" fill="#F43F5E">final</text> <text x="45" y="0" fill="#E5E7EB">dbProvider = Provider&lt;AppDatabase&gt;((ref) {</text>
          <text x="0" y="24" fill="#9CA3AF">  // Synchronous background isolate executor</text>
          <text x="0" y="48" fill="#38BDF8">  final</text> <text x="45" y="48" fill="#E5E7EB">executor = NativeDatabase.createInBackground(file);</text>
          <text x="0" y="72" fill="#F43F5E">  return</text> <text x="55" y="72" fill="#E5E7EB">AppDatabase(executor);</text>
          <text x="0" y="96" fill="#E5E7EB">});</text>
        </g>

        <text x="0" y="225" fill="#9CA3AF" font-family="sans-serif" font-size="12">This architecture prevents UI lockups by isolating SQLite writes to a secondary thread.</text>
      </g>

      <!-- Bottom Chat Input -->
      <rect x="0" y="440" width="570" height="44" rx="22" fill="#252736" stroke="#3D4058" stroke-width="1"/>
      <text x="20" y="467" fill="#6B7280" font-family="sans-serif" font-size="12">Ask Cerebro anything regarding your local repositories...</text>
      <circle cx="540" cy="462" r="14" fill="#6366F1"/>
      <path d="M536 462 L544 462 M541 458 L545 462 L541 466" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
    </g>
  </g>
</svg>
